name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  validate:
    if: github.actor != 'dependabot[bot]'
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Redaction.slnx

      - name: Build
        run: dotnet build KeelMatrix.Redaction.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test tests/KeelMatrix.Redaction.Tests/KeelMatrix.Redaction.Tests.csproj
          --configuration Release
          --no-build
          --framework net8.0
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/TestResults

  validate-dependabot:
    if: github.actor == 'dependabot[bot]'
    name: Validate (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Redaction.slnx

      - name: Build
        run: dotnet build KeelMatrix.Redaction.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test tests/KeelMatrix.Redaction.Tests/KeelMatrix.Redaction.Tests.csproj
          --configuration Release
          --no-build
          --framework net8.0

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs:
      - validate
      - validate-dependabot
    outputs:
      release_version: ${{ steps.release_version.outputs.version }}
    if: |
      always() &&
      !cancelled() &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (needs.validate-dependabot.result == 'success' || needs.validate-dependabot.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.201

      - name: Restore
        run: dotnet restore KeelMatrix.Redaction.slnx

      - name: Verify formatting
        run: dotnet format KeelMatrix.Redaction.slnx --verify-no-changes --no-restore

      - name: Check for vulnerable dependencies
        run: dotnet list KeelMatrix.Redaction.slnx package --vulnerable

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            else
              echo "::error::Release tags must match vX.Y.Z with non-negative integer components."
              exit 1
            fi
          else
            version=""
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build library
        run: dotnet build src/KeelMatrix.Redaction/KeelMatrix.Redaction.csproj --configuration Release --no-restore

      - name: Pack
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          pack_args=()
          if [[ -n "$RELEASE_VERSION" ]]; then
            pack_args+=("-p:Version=$RELEASE_VERSION")
          fi
          dotnet pack src/KeelMatrix.Redaction/KeelMatrix.Redaction.csproj --configuration Release --no-build --include-symbols --p:SymbolPackageFormat=snupkg --output ./artifacts/packages "${pack_args[@]}"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/packages
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: pack
    if: ${{ always() && needs.pack.result == 'success' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && needs.pack.outputs.release_version != '' }}
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: ./artifacts/packages

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.201

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dmitriyzen

      - name: Push packages to NuGet
        run: |
          dotnet nuget push "./artifacts/packages/KeelMatrix.Redaction.${{ needs.pack.outputs.release_version }}.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate
          dotnet nuget push "./artifacts/packages/*.snupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: ./artifacts/packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
