name: Dependency submission

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  submit-nuget-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.201'
      - name: Restore dependencies
        run: dotnet restore KeelMatrix.Redaction.slnx
      - name: Submit resolved NuGet dependency graph
        uses: advanced-security/component-detection-dependency-submission-action@v0.1.4
        with:
          filePath: .
          detectorsCategories: NuGet
